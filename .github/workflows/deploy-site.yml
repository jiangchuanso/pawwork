name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-site.yml"
      - "package.json"
      - "site/**"

  # Build-check the site on PRs that touch it; deploy step is skipped (see below)
  pull_request:
    paths:
      - ".github/workflows/deploy-site.yml"
      - "package.json"
      - "site/**"

  # Allow manual trigger for first deploy or re-deploy without code change
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pawwork/site build

      # Preflight: surface a clear warning and skip the deploy when the Cloudflare
      # credentials aren't configured, instead of letting wrangler crash in the
      # non-interactive runner. Gated to main (PRs never deploy anyway).
      - name: Check Cloudflare credentials
        id: cf-creds
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "has-creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Cloudflare credentials::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID secret is not set in this repo. Skipping Pages deploy — add them under Settings → Secrets and variables → Actions."
            exit 0
          fi
          echo "has-creds=true" >> "$GITHUB_OUTPUT"

      # Deploy only when on main AND credentials are present. PRs and manual runs
      # from other branches stop after the build-check steps above, so the fixed
      # --branch=main below can never publish non-main content.
      - name: Deploy site
        if: github.ref == 'refs/heads/main' && steps.cf-creds.outputs.has-creds == 'true'
        run: pnpm exec wrangler pages deploy site/dist --project-name=pawwork --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
